name: Ejecutar AE3 - Transformación y enriquecimiento
 
on:
  push:
    branches:
      - main
    paths:
      - "AE3/**"
      - "!AE3/documento/**"
      - ".github/workflows/ejecutar-ae3.yml"
 
permissions:
  contents: write
 
concurrency:
  group: ejecutar-ae3-main
  cancel-in-progress: false
 
jobs:
  ejecutar-notebook:
    runs-on: ubuntu-latest
 
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
 
      - name: Crear entorno virtual
        run: python -m venv .venv
 
      - name: Instalar dependencias
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
 
      - name: Ejecutar notebook AE3
        working-directory: AE3/notebooks
        env:
          API_KEY_NVIDIA: ${{ secrets.API_KEY_NVIDIA }}
        run: |
          source ../../.venv/bin/activate
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            AE3_Transformacion_Enriquecimiento.ipynb
 
      - name: Verificar reportes generados
        run: |
          archivos=(
            AE3/resultados/resumen_dataframe.txt
            AE3/resultados/resumen_dataframe_metadata.txt
            AE3/resultados/WA_Crash_enriquecido.csv
            AE3/resultados/validacion_llm_tablas.csv
          )
          for tabla in calzada interseccion franja_horaria tipo_vehiculo anio mes dia_semana total_vehiculos
          do
            archivos+=("AE3/resultados/tabla_${tabla}.txt" "AE3/resultados/tabla_${tabla}.csv")
          done
          for archivo in "${archivos[@]}"
          do
            if ! test -s "$archivo"; then
              echo "::error::No se generó el archivo requerido o está vacío: $archivo"
              exit 1
            fi
          done
          echo "Se verificaron ${#archivos[@]} archivos en AE3/resultados."
 
      - name: Confirmar cambios generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AE3/notebooks/AE3_Transformacion_Enriquecimiento.ipynb AE3/resultados/*.txt AE3/resultados/*.csv
 
          if git diff --cached --quiet; then
            echo "No se generaron cambios."
            exit 0
          fi
 
          git commit -m "chore: actualizar resultados de AE3 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
 