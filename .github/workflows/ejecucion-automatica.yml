name: Ejecutar AE2 - Análisis WA_Crash

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ejecutar-ae2-main
  cancel-in-progress: false

jobs:
  ejecutar-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Crear entorno virtual
        run: python -m venv .venv

      - name: Instalar dependencias
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Limpiar reportes generados
        run: |
          mkdir -p AE2/resultados
          find AE2/resultados -type f -name '*.txt' -delete

      - name: Ejecutar notebook AE2
        working-directory: AE2/notebooks
        run: |
          source ../../.venv/bin/activate
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            Semana_1SINC.ipynb

      - name: Verificar documentos generados
        run: |
          for archivo in \
            AE2/resultados/resumen_dataframe.txt \
            AE2/resultados/resumen_dataframe_metadata.txt \
            AE2/resultados/WA_Crash_transformado.txt \
            AE2/resultados/WA_Crash_reporte_descriptivo_transformado.txt
          do
            if ! test -s "$archivo"; then
              echo "::error::No se generó el archivo requerido o está vacío: $archivo"
              exit 1
            fi
          done

      - name: Confirmar cambios generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AE2/notebooks/Semana_1SINC.ipynb AE2/resultados/*.txt

          if git diff --cached --quiet; then
            echo "No se generaron cambios."
            exit 0
          fi

          git commit -m "chore: actualizar resultados [skip ci]"
          git push origin HEAD:main